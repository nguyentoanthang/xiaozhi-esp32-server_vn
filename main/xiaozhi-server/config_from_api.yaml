# If you only want a lightweight install of xiaozhi-server using local config files only, ignore this file and do not change anything in it
# If you want to get the config from manager-api, read on:
# Copy this file to the xiaozhi-server/data directory (create the data directory if it does not exist) and name the copied file .config.yaml
# Note: if the data directory already has a .config.yaml file, delete it first
# Start manager-api and manager-web first and register an account; the first registered account is the administrator
# As the administrator, open the [Parameter Management] page, find [server.secret] and copy its parameter value. Note that server.secret changes on every fresh deployment
# Open the .config.yaml file in this data directory and set manager-api.secret to the server.secret you just copied
server:
  ip: 0.0.0.0
  port: 8000
  # Port of the http service, used by the vision analysis API
  http_port: 8003
  # Vision analysis API address
  # The vision analysis API address sent to devices
  # With the default value below, the system automatically generates the vision recognition address and prints it in the startup log; you can open this address directly in a browser to verify it
  # It may not be accurate when you deploy with docker or on the public network (using ssl or a domain name)
  # So if you deploy with docker, set vision_explain to a LAN address
  # If you deploy on the public network, set vision_explain to a public address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
manager-api:
  # Your manager-api address; a LAN ip is recommended
  # If you deploy with docker, fill in http://xiaozhi-esp32-server-web:8002/xiaozhi
  url: http://127.0.0.1:8002/xiaozhi
  # Your manager-api token, i.e. the server.secret you just copied
  secret: your_server_secret
# Default system prompt template file
prompt_template: agent-base-prompt.txt