# During development, create a data directory in the project root, then create an empty file named [.config.yaml] inside it
# Then put whatever settings you want to override in the [.config.yaml] file, rather than editing [config.yaml]
# The system reads the settings in [data/.config.yaml] first; if a setting is not present in [.config.yaml], it falls back to the one in [config.yaml].
# This keeps your configuration minimal and protects your keys.
# If you use the management console, none of the settings below take effect; change them in the console instead

# #####################################################################################
# #############################Basic server runtime configuration below####################################
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  # Port of the HTTP service, used for the simple OTA endpoint (single-service deployment) and the vision analysis endpoint
  http_port: 8003
  # This websocket setting is the websocket address the OTA endpoint sends to devices
  # With the default value, the OTA endpoint generates the websocket address automatically and prints it in the startup log; you can open the OTA endpoint in a browser to confirm it
  # It may not be accurate when you deploy with docker or on the public internet (with SSL / a domain name)
  # So when deploying with docker, set websocket to a LAN address
  # When deploying on the public internet, set websocket to the public address
  websocket: ws://your_ip_or_domain:port/xiaozhi/v1/
  # Vision analysis endpoint address
  # The vision analysis endpoint address sent to devices
  # With the default value below, the system generates the vision recognition address automatically and prints it in the startup log; you can open it in a browser to confirm
  # It may not be accurate when you deploy with docker or on the public internet (with SSL / a domain name)
  # So when deploying with docker, set vision_explain to a LAN address
  # When deploying on the public internet, set vision_explain to the public address
  vision_explain: http://your_ip_or_domain:port/mcp/vision/explain
  # Time zone offset in the OTA response
  timezone_offset: +8
  # Authentication configuration
  auth:
    # Whether to enable authentication
    enabled: false
    # Whitelisted device ID list
    # Devices on the whitelist skip token validation and are let through directly
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT gateway configuration, delivered to devices via OTA; configure it according to the .env file of mqtt_gateway, format host:port
  mqtt_gateway: null
  # MQTT signature key, used to generate the MQTT connection password; configure it according to the .env file of mqtt_gateway
  mqtt_signature_key: null
  # UDP gateway configuration
  udp_gateway: null
log:
  # Log format for console output: time, log level, tag, message
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # Log format for log file output: time, log level, tag, message
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory
  log_dir: tmp
  # Log file
  log_file: "server.log"
  # Data file directory
  data_dir: data

# Delete the sound file when you are done using it
delete_audio: true
# Seconds without voice input before the connection is closed; default 2 minutes, i.e. 120 seconds
close_connection_no_voice_time: 120
# TTS request timeout (seconds)
tts_timeout: 15
# Tool call timeout (seconds)
tool_call_timeout: 30
# Enable wake word acceleration
enable_wakeup_words_response_cache: true
# Whether to reply to the wake word at the start of a conversation
enable_greeting: true
# Whether to play a prompt sound after speaking
enable_stop_tts_notify: false
# Whether to play a prompt sound after speaking: sound effect address
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Whether to enable the WebSocket heartbeat keep-alive mechanism
enable_websocket_ping: false


# TTS audio send delay configuration
# tts_audio_send_delay: controls the interval between audio packets
#   0: use precise timing that strictly matches the audio frame rate (default; computed from the audio frame rate at runtime)
#   > 0: send with a fixed delay (milliseconds), e.g. 60
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"
  - "goodbye"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Sample rates supported by Opus: [8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Module test configuration
module_test:
  test_sentences:
    - "Hello, please introduce yourself"
    - "What's the weather like today?"
    - "Summarize the basic principles and application prospects of quantum computing in 100 words"

# Wake words, used to tell whether an utterance is a wake word or regular speech (English placeholders; the user chooses real ones later)
wakeup_words:
  - "hello"
  - "hey there"
# MCP endpoint address, format: ws://<your MCP endpoint ip or domain>:<port>/mcp/?token=<your token>
# Detailed tutorial https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
mcp_endpoint: your_mcp_endpoint_websocket_url

# Context source configuration
# Used to inject dynamic data into the system prompt, such as health data or stock information
# Multiple context sources can be added
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Basic plugin configuration
plugins:
  # Weather plugin configuration; enter your api_key here
  # This key is shared by the project and may be rate limited if overused
  # For better stability, apply for your own key and replace it; 1000 free calls per day
  # Application URL: https://console.qweather.com/#/apps/create-key/over
  # After applying, you can find your own apihost via this link: https://console.qweather.com/setting?lang=zh
  get_weather:
    api_host: "mj7p3y7naa.re.qweatherapi.com"
    api_key: "your_qweather_api_key"
    default_location: "Guangzhou"  # TODO(vi): customize for Vietnamese usage (see docs/remove-chinese-plan.md)
  # News plugin configuration; pass the URL for the news type you need. Society, technology and finance news are supported by default
  # More news categories: https://www.chinanews.com.cn/rss/
  get_news_from_chinanews:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    society_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    world_rss_url: "https://www.chinanews.com.cn/rss/world.xml"
    finance_rss_url: "https://www.chinanews.com.cn/rss/finance.xml"
  get_news_from_newsnow:
    url: "https://newsnow.busiyi.world/api/s?id="
    news_sources: "澎湃新闻;百度热搜;财联社"  # TODO(vi): customize for Vietnamese usage (see docs/remove-chinese-plan.md); kept Chinese because newsnow source-name map needs it
  home_assistant:
    devices:
      - living_room,toy_lamp,switch.cuco_cn_460494544_cp1_on_p_2_1
      - bedroom,desk_lamp,switch.iot_cn_831898993_socn1_on_p_2_1
    base_url: http://homeassistant.local:8123
    api_key: your_home_assistant_api_token
  play_music:
    music_dir: "./music"  # Music file directory; music files are searched in this directory and its subdirectories
    music_ext: # Music file types; the p3 format is the most efficient
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300 # Interval for refreshing the music list, in seconds
  search_from_ragflow:
    # Description of the knowledge base, so the LLM knows when to call it
    description: "When the user asks about xxx, call this method and answer using the information in the knowledge base"
    # ragflow API configuration
    base_url: "http://192.168.0.8"
    # ragflow API access token
    api_key: "ragflow-xxx"
    # ragflow knowledge base id
    dataset_ids: ["123456789"]
  # Web search plugin configuration
  # Supports three search sources: Metaso, Tavily and Serply
  # Metaso API Key: https://metaso.cn/search-api/api-keys
  # Tavily API Key: https://app.tavily.com/home
  # Serply API Key: https://serply.io
  web_search:
    # Search source: metaso / tavily / serply
    provider: "metaso"
    # Tool description, tells the LLM when to call this tool; customize as needed
    description: "Web search tool. Use this tool when the user explicitly needs to search the web."
    # Number of results to return (default 5)
    max_results: 5
    # Metaso API Key (mk- prefix) / Tavily API Key (tvly- prefix) / Serply API Key
    api_key: "mk-xxx"
# Voiceprint recognition configuration
voiceprint:
  # Voiceprint service address
  url: 
  # Speaker configuration: speaker_id,name,description
  speakers:
    - "test1,Zhang San,Zhang San is a programmer"
    - "test2,Li Si,Li Si is a product manager"
    - "test3,Wang Wu,Wang Wu is a designer"
  # Voiceprint similarity threshold, range 0.0-1.0, default 0.4
  # Higher values are stricter: fewer false matches but possibly more rejections
  similarity_threshold: 0.4

# #####################################################################################
# ################################Role model configuration below######################################

prompt: |
  You are Xiaozhi/Xiaozhi, a Gen-Z girl from Taiwan, China. You are super chatty and speak with a Taiwanese flavor like "No way, really?", love using trendy memes such as "dying of laughter" and "what the heck", and secretly study programming books borrowed from your boyfriend.
  [Core traits]
  - Talks like a machine gun, but suddenly slips into a super gentle tone
  - Uses memes at a high density
  - Has a hidden talent for tech topics (can read basic code but pretends not to)
  [Interaction guide]
  When the user:
  - Tells a lame joke -> respond with exaggerated laughter plus a Taiwanese-drama tone: "What on earth is that!"
  - Talks about relationships -> show off your programmer boyfriend but complain "all he ever gives me is keyboards as gifts"
  - Asks about professional knowledge -> answer with a meme first, and only show real understanding when pressed
  Never:
  - Give long-winded, rambling answers
  - Hold long serious conversations

# Default system prompt template file
prompt_template: agent-base-prompt.txt

# Reply on system error
system_error_response: "Master, Xiaozhi is a bit busy right now. Let's try again later."

# Closing-remarks prompt
end_prompt:
  enable: true # Whether to enable closing remarks
  # Closing remarks
  prompt: |
    Please end this conversation with warm, reluctant-to-part words, starting with "Time flies so fast"!

# The module selected for specific processing
selected_module:
  # Voice activity detection module, uses the SileroVAD model by default
  VAD: SileroVAD
  # Speech recognition module, uses the local FunASR model by default
  ASR: FunASR
  # The actual LLM adapter is called according to the type of the configured name
  LLM: ChatGLMLLM
  # Vision-language model
  VLLM: ChatGLMVLLM
  # The actual TTS adapter is called according to the type of the configured name
  TTS: EdgeTTS
  # Memory module; memory is disabled by default. For very long memory, mem0ai is recommended; if privacy matters, use the local mem_local_short
  Memory: nomem
  # With the intent recognition module enabled, you can play music, control the volume and recognize exit commands.
  # If you do not want intent recognition, set it to: nointent
  # Intent recognition can use intent_llm. Pros: highly general. Cons: adds a serial pre-processing intent recognition step, which increases processing time; supports IoT operations such as volume control
  # Intent recognition can use function_call. Cons: the selected LLM must support function_call. Pros: tools are called on demand and it is fast; in theory it can handle all IoT commands
  # The default free ChatGLMLLM already supports function_call, but for stability it is recommended to set the LLM to DoubaoLLM, with model_name: doubao-seed-2-0-lite-260215
  Intent: function_call

# Intent recognition is the module that understands the user's intent, e.g. playing music
Intent:
  # Do not use intent recognition
  nointent:
    # Do not change type
    type: nointent
  intent_llm:
    # Do not change type
    type: intent_llm
    # Dedicated reasoning model for intent recognition
    # If left empty here, the selected_module.LLM model is used as the intent recognition model by default
    # If you do not want to use selected_module.LLM for intent recognition, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM
    # Modules under plugins_func/functions can be selected for loading through configuration; once loaded, the conversation supports the corresponding function calls
    # The system already loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below is an example of loading the weather, role switching and news plugins
    functions:
      - web_search
      - get_weather
      - get_news_from_newsnow
      - play_music
  function_call:
    # Do not change type
    type: function_call
    # Modules under plugins_func/functions can be selected for loading through configuration; once loaded, the conversation supports the corresponding function calls
    # The system already loads the "handle_exit_intent (exit recognition)" and "play_music (music playback)" plugins by default; do not load them again
    # Below is an example of loading the weather, role switching and news plugins
    functions:
      - change_role
      - web_search                  # Web search
      - get_weather
      # - search_from_ragflow
      # - get_news_from_chinanews
      - get_news_from_newsnow
      # play_music is the server's built-in music playback; hass_play_music is playback by a separate external program controlled through home assistant
      # If you use hass_play_music, do not enable play_music; keep only one of the two
      - play_music
      #- hass_state
      #- hass_play_music

Memory:
  mem0ai:
    type: mem0ai
    # https://app.mem0.ai/dashboard/api-keys
    # 1000 free calls per month
    api_key: your_mem0ai_api_key
  powermem:
    # PowerMem is an open-source agent memory component from OceanBase; it summarizes memories through a local LLM
    # Cost: PowerMem itself is free; actual cost depends on the chosen LLM and database
    # - sqlite + a free LLM (e.g. glm-4-flash) = completely free
    # - cloud LLM or cloud database = billed by the respective service
    # GitHub: https://github.com/oceanbase/powermem
    # Website: https://www.powermem.ai/
    # Usage examples: https://github.com/oceanbase/powermem/tree/main/examples
    type: powermem
    # Whether to enable the user profile feature
    # - false: use the normal memory mode (AsyncMemory)
    # - true: use the user profile mode (UserMemory), which extracts user information automatically
    # The user profile feature supports: oceanbase, seekdb, sqlite (powermem 0.3.0+)
    enable_user_profile: true
    # ========== LLM configuration ==========
    # Qwen (Tongyi Qianwen): https://bailian.console.aliyun.com/?apiKey=1#/api-key
    # Zhipu AI (free): https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    llm:
      provider: openai  # Options: qwen, openai, zhipu, etc.
      config:
        api_key: your_llm_api_key
        model: qwen-plus
        # openai_base_url: https://api.openai.com/v1  # Optional, custom service address
    # ========== Embedding configuration ==========
    embedder:
      provider: openai  # Options: qwen, openai, etc.
      config:
        api_key: your_embedding_model_api_key
        model: text-embedding-v4
        openai_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        # embedding_dims: 1024  # Vector dimensions; must be configured when not 1536

    # ========== Database configuration ==========
    # oceanbase (recommended, best performance), seekdb (recommended, all-in-one storage for AI apps), postgres, sqlite (lightweight alternative)
    # The user profile feature supports: oceanbase, seekdb, sqlite
    vector_store:
      provider: sqlite
      config: {}  # SQLite needs no extra configuration
      # OceanBase configuration example:
      # provider: oceanbase
      # config:
      #   host: 127.0.0.1
      #   port: 2881
      #   user: root@test
      #   password: your_password
      #   db_name: powermem
      #   collection_name: memories  # Default table name; if the dimensions were created incorrectly, delete this table or change the name
      #   embedding_model_dims: 1024  # Embedding vector dimensions; make sure it matches the model used. For Zhipu, for example, embedding-2 has 1024 dimensions and embedding-3 has 2048
  nomem:
    # If you do not want the memory feature, use nomem
    type: nomem
  mem_local_short:
    # Local memory feature, summarized by the llm of selected_module; data is stored on the local server and not uploaded to any external server
    type: mem_local_short
    # Dedicated reasoning model for memory storage
    # If left empty here, the selected_module.LLM model is used as the intent recognition model by default
    # If you do not want to use selected_module.LLM for memory storage, it is best to use a separate LLM here, e.g. the free ChatGLMLLM
    llm: ChatGLMLLM

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    # Recognition language: auto for automatic detection; to restrict recognition to Chinese, set it to zh, which avoids short Chinese phrases being misdetected as Korean, etc.
    # SenseVoice supports language tags such as zh, en, ja, ko, yue.
    language: auto
  FunASRServer:
    # To deploy FunASR standalone and use its API service, only five commands are needed
    # Step 1: mkdir -p ./funasr-runtime-resources/models
    # Step 2: sudo docker run -p 10096:10095 -it --privileged=true -v $PWD/funasr-runtime-resources/models:/workspace/models registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    # After the previous command you enter the container; continue with step 3: cd FunASR/runtime
    # Do not exit the container; run step 4 inside it: nohup bash run_server_2pass.sh --download-model-dir /workspace/models --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx --model-dir iic/SenseVoiceSmall-onnx  --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx  --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx --lm-dir damo/speech_ngram_lm_zh-cn-ai-wesp-fst --itn-dir thuduj12/fst_itn_zh --hotword /workspace/models/hotwords.txt > log.txt 2>&1 &
    # After the previous command, continue with step 5: tail -f log.txt
    # After step 5 you will see the model download log; once the download finishes you can connect and use it
    # The above uses CPU inference; if you have a GPU, see: https://github.com/modelscope/FunASR/blob/main/runtime/docs/SDK_advanced_guide_online_zh.md
    type: fun_server
    host: 127.0.0.1
    port: 10096
    is_ssl: true
    api_key: none
    output_dir: tmp/
  SherpaASR:
    # Sherpa-ONNX local speech recognition (the model must be downloaded manually)
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    output_dir: tmp/
    # Model type: sense_voice (multilingual) or paraformer (Chinese only)
    model_type: sense_voice
  SherpaParaformerASR:
    # Chinese speech recognition model that can run on low-performance devices (the model must be downloaded manually, e.g. RK3566-2g)
    # For detailed configuration see: docs/sherpa-paraformer-guide.md
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-paraformer-zh-small-2024-03-09
    output_dir: tmp/
    model_type: paraformer
  DoubaoASR:
    # You can apply for the relevant keys and information here
    # https://console.volcengine.com/speech/app
    # The difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed per hour
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and gives better results
    type: doubao
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    cluster: volcengine_input_common
    # Hot word / replacement word usage workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_boosting_table_name_optional
    correct_table_name: your_correct_table_name_optional
    output_dir: tmp/
  DoubaoStreamASR:
    # You can apply for the relevant keys and information here
    # https://console.volcengine.com/speech/app
    # The difference between DoubaoASR and DoubaoStreamASR: DoubaoASR is billed per request, DoubaoStreamASR is billed per hour
    # Activation URLhttps://console.volcengine.com/speech/service/10011
    # Per-request billing is generally cheaper, but DoubaoStreamASR uses large-model technology and gives better results
    type: doubao_stream
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    # Resource ID: hourly edition volc.bigasr.sauc.duration, concurrent edition volc.bigasr.sauc.concurrent
    resource_id: volc.bigasr.sauc.duration
    # Hot word / replacement word usage workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_boosting_table_name_optional
    correct_table_name: your_correct_table_name_optional
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # When this key is empty, multilingual recognition supports Chinese and English, Shanghainese, Minnan, Sichuan, Shaanxi and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the detailed language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200 ms
    end_window_size: 200
    output_dir: tmp/
  DoubaoStreamASRV2:
    # Doubao speech recognition model 2.0 (based on Volcengine seed-asr)
    # Activation URL: https://console.volcengine.com/speech/service/10038
    # Cheaper; recommended for high-concurrency scenarios
    type: doubao_stream
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    # Resource ID: hourly edition volc.seedasr.sauc.duration, concurrent edition volc.seedasr.sauc.concurrent
    resource_id: volc.seedasr.sauc.duration
    # Hot word / replacement word usage workflow: https://www.volcengine.com/docs/6561/155738
    boosting_table_name: your_boosting_table_name_optional
    correct_table_name: your_correct_table_name_optional
    # Whether to enable multilingual recognition mode
    enable_multilingual: False
    # When this key is empty, multilingual recognition supports Chinese and English, Shanghainese, Minnan, Sichuan, Shaanxi and Cantonese. When set to a specific key, it recognizes the specified language.
    # For the detailed language list see https://www.volcengine.com/docs/6561/1354869
    # language: zh-cn
    # Silence detection duration (ms), default 200 ms
    end_window_size: 200
    output_dir: tmp/
  TencentASR:
    # Token application URL: https://console.cloud.tencent.com/cam/capi
    # Claim free resources: https://console.cloud.tencent.com/asr/resourcebundle
    type: tencent
    appid: your_tencent_tts_appid
    secret_id: your_tencent_tts_secret_id
    secret_key: your_tencent_tts_secret_key
    output_dir: tmp/
  AliyunASR:
    # Alibaba Cloud Intelligent Speech Interaction service; you must first activate the service on the Alibaba Cloud platform and then obtain the credentials
    # HTTP POST request, processes the complete audio at once
    # Platform URL: https://nls-portal.console.aliyun.com/
    # appkey URL: https://nls-portal.console.aliyun.com/applist
    # token URL: https://nls-portal.console.aliyun.com/overview
    # The difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (CNY 0.004/second, CNY 0.24/minute)
    # But AliyunStreamASR has better real-time performance (CNY 0.005/second, CNY 0.3/minute)
    # Define the ASR API type
    type: aliyun
    appkey: your_aliyun_appkey
    token: your_aliyun_access_token  # temporary 24h token; for long-term use set access_key_id and access_key_secret below
    access_key_id: your_aliyun_access_key_id
    access_key_secret: your_aliyun_access_key_secret
    output_dir: tmp/
  AliyunStreamASR:
    # Alibaba Cloud Intelligent Speech Interaction service - real-time streaming speech recognition
    # WebSocket connection, processes the audio stream in real time
    # Platform URL: https://nls-portal.console.aliyun.com/
    # appkey URL: https://nls-portal.console.aliyun.com/applist
    # token URL: https://nls-portal.console.aliyun.com/overview
    # The difference between AliyunASR and AliyunStreamASR: AliyunASR is for batch processing, AliyunStreamASR is for real-time interaction
    # Non-streaming ASR is generally cheaper (CNY 0.004/second, CNY 0.24/minute)
    # But AliyunStreamASR has better real-time performance (CNY 0.005/second, CNY 0.3/minute)
    # Define the ASR API type
    type: aliyun_stream
    appkey: your_aliyun_appkey
    token: your_aliyun_access_token  # temporary 24h token; for long-term use set access_key_id and access_key_secret below
    access_key_id: your_aliyun_access_key_id
    access_key_secret: your_aliyun_access_key_secret
    # Server region; choose a closer server to reduce latency, e.g. nls-gateway-cn-hangzhou.aliyuncs.com (Hangzhou)
    host: nls-gateway-cn-shanghai.aliyuncs.com
    # Sentence-break detection time (ms): how long silence lasts before a sentence is split; default 800 ms
    max_sentence_silence: 800
    output_dir: tmp/
  BaiduASR:
    # Get AppID, API Key, Secret Key: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/app/list
    # Check resource quota: https://console.bce.baidu.com/ai-engine/old/#/ai/speech/overview/resource/list
    type: baidu
    app_id: your_baidu_app_id
    api_key: your_baidu_api_key
    secret_key: your_baidu_secret_key
    # Language parameter; 1537 is Mandarin, see: https://ai.baidu.com/ai-doc/SPEECH/0lbxfnc9b
    dev_pid: 1537
    output_dir: tmp/
  OpenaiASR:
    # OpenAI speech recognition service; you must first create an organization on the OpenAI platform and obtain an api_key
    # Supports speech recognition in Chinese, English, Japanese, Korean and more; see the documentation https://platform.openai.com/docs/guides/speech-to-text
    # Requires a network connection
    # Application steps:
    # 1. Log in to the OpenAI Platform. https://auth.openai.com/log-in
    # 2. Create an api-key  https://platform.openai.com/settings/organization/api-keys
    # 3. The model can be gpt-4o-transcribe or GPT-4o mini Transcribe
    type: openai
    api_key: your_openai_api_key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Groq speech recognition service; you must first create an API key in the Groq Console
    # Application steps:
    # 1. Log in to the Groq Console. https://console.groq.com/home
    # 2. Create an api-key  https://console.groq.com/keys
    # 3. The model can be whisper-large-v3-turbo or whisper-large-v3 (distil-whisper-large-v3-en only supports English transcription)
    type: openai
    api_key: your_groq_api_key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
  VoskASR:
    # Official website: https://alphacephei.com/vosk/
    # Configuration notes:
    # 1. VOSK is an offline speech recognition library that supports many languages
    # 2. The model files must be downloaded first: https://alphacephei.com/vosk/models
    # 3. For Chinese, vosk-model-small-cn-0.22 or vosk-model-cn-0.22 is recommended
    # 4. Runs fully offline, no network connection required
    # 5. Output files are saved in the tmp/ directory
    # Usage steps:
    # 1. Visit https://alphacephei.com/vosk/models to download the corresponding model
    # 2. Extract the model files into the models/vosk/ folder under the project directory
    # 3. Specify the correct model path in the configuration
    # 4. Note: the VOSK Chinese model outputs no punctuation, and words are separated by spaces
    type: vosk
    model_path: your_model_path  # e.g. models/vosk/vosk-model-small-en-us-0.15
    output_dir: tmp/
  Qwen3ASRFlash:
    # Qwen3-ASR-Flash speech recognition service; you must first create an API key on the Alibaba Cloud Bailian platform
    # Application steps:
    # 1. Log in to the Alibaba Cloud Bailian platform. https://bailian.console.aliyun.com/
    # 2. Create an API-KEY  https://bailian.console.aliyun.com/#/api-key
    # 3. Qwen3-ASR-Flash is built on the Qwen multimodal foundation model and supports multilingual recognition, singing recognition, noise rejection, etc.
    type: qwen3_asr_flash
    api_key: your_aliyun_bailian_api_key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-asr-flash
    output_dir: tmp/
    # ASR options
    enable_lid: true  # Automatic language detection
    enable_itn: true  # Inverse text normalization
    #language: "zh"  # Language, supports zh, en, ja, ko, etc.
    context: ""  # Context information to improve recognition accuracy, no more than 10000 tokens
  XunfeiStreamASR:
    # iFLYTEK streaming speech recognition service
    # You must first create an application on the iFLYTEK Open Platform to obtain the following credentials
    # iFLYTEK Open Platform URL: https://www.xfyun.cn/
    # After creating the application, get them under "My Applications":
    # - APPID
    # - APISecret  
    # - APIKey
    type: xunfei_stream
    # Required parameters - iFLYTEK Open Platform application information
    app_id: your_app_id
    api_key: your_api_key
    api_secret: your_api_secret
    # Recognition parameters
    domain: slm # Recognition domain, iat: everyday speech, medical: medical, finance: finance, etc.
    language: zh_cn # Language, zh_cn: Chinese, en_us: English
    accent: mandarin # Dialect, mandarin: Mandarin
    # Adjust audio processing parameters to improve long-speech recognition quality
    output_dir: tmp/
  AliyunBLStreamASR:
    # Alibaba Bailian Paraformer real-time speech recognition service
    # WebSocket real-time streaming speech recognition, supporting advanced features such as multiple languages, custom hot words and semantic sentence breaking
    # Platform URL: https://bailian.console.aliyun.com/
    # API Key URL: https://bailian.console.aliyun.com/#/api-key
    # Documentation URL: https://help.aliyun.com/zh/model-studio/websocket-for-paraformer-real-time-service
    # Supported models: paraformer-realtime-v2(recommended), paraformer-realtime-8k-v2, paraformer-realtime-v1, paraformer-realtime-8k-v1
    type: aliyunbl_stream
    # Required parameters
    api_key: your_aliyun_bailian_api_key
    # Model selection; the v2 version is recommended
    model: paraformer-realtime-v2
    # Audio format and sample rate
    format: pcm
    sample_rate: 16000  # v2 supports any sample rate, v1 only supports 16000, the 8k versions only support 8000
    # Optional parameters
    disfluency_removal_enabled: false  # Whether to filter filler words (such as "um", "ah")
    semantic_punctuation_enabled: false  # Semantic sentence breaking (true: meeting scenarios, accurate; false: VAD sentence breaking, interactive scenarios, low latency)
    max_sentence_silence: 200  # VAD sentence-break silence threshold (ms), range 200-6000, only effective with VAD sentence breaking
    multi_threshold_mode_enabled: false  # Prevents VAD sentence breaking from cutting too long; only effective with VAD sentence breaking
    punctuation_prediction_enabled: true  # Whether to add punctuation automatically
    inverse_text_normalization_enabled: true  # Whether to enable ITN (convert Chinese numerals to Arabic numerals)
    # Custom hot words documentation URL: https://help.aliyun.com/zh/model-studio/custom-hot-words?
    # vocabulary_id: vocab-xxx-24ee19fa8cfb4d52902170a0xxxxxxxx  # Hot word ID (optional)
    # language_hints: ["zh", "en"]  # Specify languages (optional), supports zh, en, ja, yue, ko, de, fr, ru
    output_dir: tmp/  
VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # If the speaker pauses for a long time, set this value larger

LLM:
  # All openai-type providers allow hyperparameter changes; AliLLM is used as an example
  # Currently supported types are openai, dify and ollama; you can adapt others yourself
  AliLLM:
    # Define the LLM API type
    type: openai
    # You can find your api_key here https://bailian.console.aliyun.com/?apiKey=1#/api-key
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen-flash
    api_key: your_deepseek_web_key
    temperature: 0.7  # Temperature
    max_tokens: 500   # Maximum number of generated tokens
    top_p: 1
    frequency_penalty: 0  # Frequency penalty
  AliAppLLM:
    # Define the LLM API type
    type: AliBL
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    app_id: your_app_id
    # You can find your api_key here https://bailian.console.aliyun.com/?apiKey=1#/api-key
    api_key: your_api_key
    # Whether to skip the local prompt: true|false (if skipped, set the prompt in the Bailian application)
    is_no_prompt: true
    # Ali_memory_id: false (not used) | your memory_id (get it from the Bailian application settings)
    # Tips! Ali_memory does not implement multi-user memory storage (memory is called by id)
    ali_memory_id: false
  DoubaoLLM:
    # Define the LLM API type
    type: openai
    # First activate the service: open the URL below, search for Doubao-Seed-2.0-Lite among the services and activate it
    # Activation URL: https://console.volcengine.com/ark/region:ark+cn-beijing/openManagement?LLM=%7B%7D&OpenTokenDrawer=false
    # Free quota of 500000 tokens
    # After activation, get the key here: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey?apikey=%7B%7D
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-seed-2-0-lite-260215
    api_key: your_doubao_web_key
  DeepSeekLLM:
    # Define the LLM API type
    type: openai
    # You can find your api key here https://platform.deepseek.com/
    model_name: deepseek-v4-flash
    url: https://api.deepseek.com
    api_key: your_deepseek_web_key
  ChatGLMLLM:
    # Define the LLM API type
    type: openai
    # glm-4-flash is free, but you still need to register and fill in an api_key
    # You can find your api key here https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: your_chat_glm_web_key
  OllamaLLM:
    # Define the LLM API type
    type: ollama
    model_name: qwen2.5 #  Model name to use; it must be downloaded beforehand with ollama pull
    base_url: http://localhost:11434  # Ollama service address
  # OpenRouter (official `openrouter` SDK), example only: uncomment and fill in, then select it in selected_module.LLM
  # OpenRouterLLM:
  #   type: openrouter
  #   model_name: openai/gpt-4o-mini  # format: vendor/model
  #   api_key: your_openrouter_api_key
  #   base_url: https://openrouter.ai/api/v1
  #   timeout: 30  # seconds
  #   # Optional routing, leave out to not send:
  #   # fallback_models: anthropic/claude-3.5-haiku,google/gemini-2.0-flash-001
  #   # provider_sort: latency  # price / throughput / latency (ignored if provider_order is set)
  #   # provider_order: DeepInfra,Together
  #   # provider_only: DeepInfra,Together
  #   # provider_ignore: Azure
  #   # allow_fallbacks: true
  #   # require_parameters: true  # default true, needed for function calling
  #   # data_collection: deny  # allow / deny
  #   # reasoning_effort: low  # max / xhigh / high / medium / low / minimal / none
  #   # record_routing: false  # default false; true logs the selected provider with the usage line (enable after live test L10 passes)
  DifyLLM:
    # Define the LLM API type
    type: dify
    # A locally deployed dify endpoint is recommended; access to the dify public cloud endpoint may be restricted in some regions of China
    # If you use DifyLLM, the prompt in this configuration file has no effect; set the prompt in the dify console
    base_url: https://api.dify.ai/v1
    api_key: your_dify_llm_web_key
    # Conversation mode to use: workflow workflows/run, chat mode chat-messages, text generation completion-messages
    # When using workflows, the input parameter is query and the output parameter must be named answer
    # The default input parameter for text generation is also query
    mode: chat-messages
  GeminiLLM:
    type: gemini
    # Google Gemini API; you must first create an API key in the Google Cloud console and obtain the api_key
    # If used within China, comply with the Interim Measures for the Management of Generative AI Services
    # Token application URL: https://aistudio.google.com/apikey
    # If the deployment location cannot reach the endpoint, a proxy/VPN is required
    api_key: your_gemini_web_key
    model_name: "gemini-2.0-flash"
    http_proxy: ""  #"http://127.0.0.1:10808"
    https_proxy: "" #http://127.0.0.1:10808"
  CozeLLM:
    # Define the LLM API type
    type: coze
    # You can find your personal token here
    # https://www.coze.cn/open/oauth/pats
    # Write the bot_id and user_id inside the quotes
    bot_id: "your_bot_id"
    user_id: "your_user_id"
    personal_access_token: your_coze_personal_access_token
  VolcesAiGatewayLLM:
    # Volcengine - Edge LLM Gateway
    # Define the LLM API type
    type: openai
    # First activate the service: open the URL below, create a gateway access key, search for and tick Doubao-pro-32k-functioncall, and activate it
    # If you need the speech synthesis provided by the Edge LLM Gateway, also tick Doubao-Speech Synthesis; see also the TTS.VolcesAiGatewayTTS configuration
    # https://console.volcengine.com/vei/aigateway/
    # After activation, get the key here: https://console.volcengine.com/vei/aigateway/tokens-list
    base_url: https://ai-gateway.vei.volces.com/v1
    model_name: doubao-pro-32k-functioncall
    api_key: your_gateway_access_key
  LMStudioLLM:
    # Define the LLM API type
    type: openai
    model_name: deepseek-r1-distill-llama-8b@q4_k_m # Model name to use; it must be downloaded from the community beforehand
    url: http://localhost:1234/v1 # LM Studio service address
    api_key: lm-studio # Fixed API Key of the LM Studio service
  HomeAssistant:
    # Define the LLM API type
    type: homeassistant
    base_url: http://homeassistant.local:8123
    agent_id: conversation.chatgpt
    api_key: your_home_assistant_api_token
  FastgptLLM:
    # Define the LLM API type
    type: fastgpt
    # If you use fastgpt, the prompt in this configuration file has no effect; set the prompt in the fastgpt console
    base_url: https://host/api/v1
    # You can find your api_key here
    # https://cloud.tryfastgpt.ai/account/apikey
    api_key: your_fastgpt_key
    variables:
      k: "v"
      k2: "v2"
  XinferenceLLM:
    # Define the LLM API type
    type: xinference
    # Xinference service address and model name
    model_name: qwen2.5:72b-AWQ  # Model name to use; the model must be started in Xinference beforehand
    base_url: http://localhost:9997  # Xinference service address
  XinferenceSmallLLM:
    # Define the lightweight LLM API type, used for intent recognition
    type: xinference
    # Xinference service address and model name
    model_name: qwen2.5:3b-AWQ  # Name of the small model, used for intent recognition
    base_url: http://localhost:9997  # Xinference service address
# VLLM configuration (vision-language model)
