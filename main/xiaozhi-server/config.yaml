TTS:
  # Currently supported types are edge and doubao; you can adapt others yourself
  EdgeTTS:
    # Define the TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  DoubaoTTS:
    # Define the TTS API type
    type: doubao
    # Volcengine speech synthesis service; you must first create an application in the Volcengine console and obtain the appid and access_token
    # Volcengine speech must be purchased; starting at CNY 30 gives 100 concurrent connections. The free tier only has 2 concurrent connections and will often report TTS errors
    # After purchasing the service and a free voice, you may need to wait about half an hour before it can be used.
    # Activate regular voices here: https://console.volcengine.com/speech/service/8
    # Activate the Wanwan Xiaohe voice here: https://console.volcengine.com/speech/service/10007; after activation set voice below to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  #Volcengine TTS, supports bidirectional streaming TTS
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to activate the speech synthesis large model and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed to: volc.service_type.10029 (large-model speech synthesis and mixing)
    # If you use Gizwits, change the endpoint address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require an appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Enable WebSocket connection reuse, enabled by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Related parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameters supported by Volcengine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
      # Multi-emotion voice parameters. Note: currently only some voices support setting emotions.
      # Related voice list: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (only supported by some voices): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Emotion intensity (1~5)
    # Advanced text processing configuration (additions) - you can add any advanced parameters supported by Volcengine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata configuration
      # cache_config: {}  # Cache configuration
    # Mix control configuration (mix_speaker) - multi-voice mixing (TTS 1.0 only)
    # Mixing mainly applies to the voices of Doubao speech synthesis model 1.0; when using it, set req_params.speaker to custom_mix_bigtts
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  #Doubao speech synthesis model 2.0, supports bidirectional streaming TTS (based on the seed-tts-2.0 resource)
  HuoshanDoubleStreamTTSV2:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10035 to activate the speech synthesis large model and purchase voices
    # Get the appid and access_token at the bottom of the page
    # The resource ID is fixed to: seed-tts-2.0 (Doubao speech synthesis model 2.0)
    # If you use Gizwits, change the endpoint address to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not require an appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: your_volcengine_tts_appid
    access_token: your_volcengine_tts_access_token
    resource_id: seed-tts-2.0
    speaker: zh_female_xiaohe_uranus_bigtts
    # Enable WebSocket connection reuse, enabled by default (note: with reuse, idle connections count toward concurrency while the device is listening)
    enable_ws_reuse: True
    # Related parameter documentation: https://www.volcengine.com/docs/6561/1329505
    # Audio output configuration (audio_params) - you can add any audio parameters supported by Volcengine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
    # Advanced text processing configuration (additions) - you can add any advanced parameters supported by Volcengine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  CosyVoiceSiliconflow:
    type: siliconflow
    # SiliconFlow TTS
    # Token application URL https://cloud.siliconflow.cn/account/ak
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:alex
    output_dir: tmp/
    access_token: your_siliconflow_api_key
    response_format: wav
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  CozeCnTTS:
    type: cozecn
    # COZECN TTS
    # Token application URL https://www.coze.cn/open/oauth/pats
    voice: 7426720361733046281
    output_dir: tmp/
    access_token: your_coze_web_key
    response_format: wav
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
    # The following need not be set; defaults are used
    # speed: 1  # Speech rate: -0.5 to 2
    # loudness_rate: 0  # Volume: -50 to 100
  VolcesAiGatewayTTS:
    type: openai
    # Volcengine - Edge LLM Gateway
    # First activate the service: open the URL below, create a gateway access key, search for and tick Doubao-Speech Synthesis, and activate it
    # If you need the LLM provided by the Edge LLM Gateway, also tick Doubao-pro-32k-functioncall; see also the LLM.VolcesAiGatewayLLM configuration
    # https://console.volcengine.com/vei/aigateway/
    # After activation, get the key here: https://console.volcengine.com/vei/aigateway/tokens-list
    api_key: your_gateway_access_key
    api_url: https://ai-gateway.vei.volces.com/v1/audio/speech
    model: doubao-tts
    # Voice list: https://www.volcengine.com/docs/6561/1257544
    voice: zh_male_shaonianzixin_moon_bigtts
    speed: 1
    output_dir: tmp/
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  FishSpeech:
    # Tutorial: https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/fish-speech-integration.md
    type: fishspeech
    output_dir: tmp/
    response_format: wav
    reference_id: null
    reference_audio: ["config/assets/wakeup_words.wav",]
    reference_text: ["Hello, I am Xiaozhi, a cheerful girl with a pleasant voice. Nice to meet you, what are you up to lately?",]
    normalize: true
    max_new_tokens: 1024
    chunk_length: 200
    top_p: 0.7
    repetition_penalty: 1.2
    temperature: 0.7
    streaming: false
    use_memory_cache: "on"
    seed: null
    channels: 1
    rate: 44100
    api_key: "your_api_key"
    api_url: "http://127.0.0.1:8080/v1/tts"
    # language: "English"  # Output language, e.g. Chinese, English, Japanese, Korean; set it according to the languages supported by the chosen voice; defaults to English if left empty
  GPT_SOVITS_V2:
    # Define the TTS API type
    #How to start TTS:
    #python api_v2.py -a 127.0.0.1 -p 9880 -c GPT_SoVITS/configs/demo.yaml
    type: gpt_sovits_v2
    url: "http://127.0.0.1:9880/tts"
    output_dir: tmp/
    text_lang: "auto"
    ref_audio_path: "demo.wav"
    prompt_text: ""
    prompt_lang: "zh"
    top_k: 5
